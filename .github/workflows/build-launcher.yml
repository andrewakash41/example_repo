name: Build Cockpit Launcher APK

on:
  push:
    paths:
      - "keylargo-launcher/**"
      - ".github/workflows/build-launcher.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: keylargo-launcher
    steps:
      # Actions are pinned to exact commits so a re-pointed tag cannot change what builds the APK.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease
      - name: Verify the APK requests only the expected permissions
        run: |
          set -euo pipefail
          apk=$(ls app/build/outputs/apk/release/*.apk)
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2
          allowed="android.permission.ACCESS_FINE_LOCATION
          android.permission.ACCESS_COARSE_LOCATION
          android.permission.ACCESS_LOCATION_EXTRA_COMMANDS
          android.permission.QUERY_ALL_PACKAGES
          android.permission.REQUEST_DELETE_PACKAGES"
          found=$("$aapt2" dump permissions "$apk" | sed -n "s/^uses-permission: name='\([^']*\)'.*/\1/p")
          echo "Permissions in APK:"; echo "$found"
          test -n "$found"
          extra=$(echo "$found" | grep -vxF -f <(echo "$allowed" | sed 's/^ *//') || true)
          if [ -n "$extra" ]; then echo "::error::Unexpected permission(s): $extra"; exit 1; fi
          echo "SHA-256 of the APK (compare after download):"
          sha256sum "$apk" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cockpit-launcher-apk
          path: keylargo-launcher/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
