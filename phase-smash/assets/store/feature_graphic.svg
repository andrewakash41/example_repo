<svg width="1024" height="500" viewBox="0 0 1024 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#160b2a"/>
      <stop offset="1" stop-color="#07040f"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="500" fill="url(#bg)"/>
  <!-- tower motif on the right -->
  <g transform="translate(760,250)" opacity="0.9">
    <ellipse cx="0" cy="-120" rx="150" ry="34" fill="#ff8a1e" opacity="0.85"/>
    <ellipse cx="0" cy="-40" rx="150" ry="34" fill="#1ec8ff" opacity="0.85"/>
    <ellipse cx="0" cy="40" rx="150" ry="34" fill="#ff8a1e" opacity="0.85"/>
    <ellipse cx="0" cy="120" rx="150" ry="34" fill="#1ec8ff" opacity="0.85"/>
    <circle cx="0" cy="-150" r="26" fill="#fff4e6"/>
  </g>
  <!-- title -->
  <text x="70" y="230" font-family="Arial, sans-serif" font-size="86" font-weight="800" fill="#ffffff">PHASE</text>
  <text x="70" y="320" font-family="Arial, sans-serif" font-size="86" font-weight="800" fill="#ff8a1e">SMASH</text>
  <text x="74" y="372" font-family="Arial, sans-serif" font-size="30" fill="#1ec8ff">Smash only what matches your color</text>
</svg>
